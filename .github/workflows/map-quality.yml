name: Map quality gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/check-public-safety.mjs'
      - 'index.html'
      - 'public/sitemap.xml'
      - 'public/assets/cv-alejo-palavecino-*.pdf'
      - '.github/workflows/map-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Architecture and lint
        run: npm run lint
      - name: Typecheck and subpath build
        run: npm run build -- --base=/PortfolioPersonal/
      - name: Inspect publication for sensitive data and SEO
        run: node tools/check-public-safety.mjs
