        <h1>Alejo Palavecino · Desarrollador de software</h1>
        <p>Soy estudiante de Ingeniería en Sistemas de Información en la UTN Mendoza. Construyo software a medida, automatizaciones con IA y experiencias web interactivas.</p>
        <p>El portfolio es un videojuego interactivo y necesita JavaScript. Acá tenés una versión accesible del contenido principal.</p>
        <h2>Proyectos destacados</h2>
        <p><strong>FoxMind:</strong> cofundador y líder del producto. Tecnología educativa para adaptar el aprendizaje y reducir la sobrecarga docente. En desarrollo, previo a pilotos. Primer puesto en el Premio ILAN 2026.</p>
        <p><strong>Flower:</strong> sistema de stock y facturación para una librería, desarrollado de punta a punta. React, Node.js, PostgreSQL y facturación mediante ARCA. En producción.</p>
        <p><strong>Agrotech:</strong> prevención antiheladas mediante predicción y activación oportuna. Segundo puesto en Emprende U 2021.</p>
        <p><strong>Irrigación:</strong> dispositivo para medir diferencias de caudal y contribuir a una distribución más equitativa del agua de riego.</p>
        <p><strong>Herbario Digital:</strong> sitio de consulta con fichas técnicas botánicas.</p>
        <p><strong>Gestión para ART:</strong> automatización de carga de fichas, manteniendo confidencial la identidad del cliente.</p>
        <h2>Contacto y oportunidades</h2>
        <p>Estoy abierto a puestos en análisis de sistemas, desarrollo full stack, frontend, backend y automatización con IA. Presencial o híbrido en Mendoza; remoto a nivel internacional. También desarrollo proyectos para emprendedores y pymes.</p>
